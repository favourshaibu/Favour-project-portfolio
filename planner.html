<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic planner: add, complete, and delete tasks." />
    <title>Planner | Favour Shaibu</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>

  <body>
    <div class="bg-orbs" aria-hidden="true"></div>

    <header class="site-header">
      <a href="index.html" class="logo">Favour Shaibu</a>

      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav id="nav-menu" class="nav-menu" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html" aria-current="page">Planner</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="page">
      <h1 class="page-title">Academic planner</h1>
      <p class="page-intro">Keep track of assignments, readings, and deadlines.</p>

      <section class="planner glass" aria-labelledby="planner-title">
        <h2 id="planner-title" class="sr-only">Task list</h2>

        <form id="task-form" novalidate>
          <label for="task-input" class="sr-only">New task</label>
          <div class="task-form-row">
            <input type="text" id="task-input" placeholder="e.g. Finish COS 106 term project" autocomplete="off" />
            <button type="submit" class="btn btn-primary">Add task</button>
          </div>
          <p id="task-error" class="field-error" role="alert"></p>
        </form>

        <p id="task-count" class="task-count" aria-live="polite"></p>

        <ul id="task-list" class="task-list"></ul>

        <p id="empty-message" class="empty-message">No tasks yet. Add your first one above.</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Favour Shaibu. Built for COS 106, Miva Open University.</p>
      <ul class="footer-links">
        <li><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </footer>
  </body>
</html>
